name: Release v1.10.3

on:
  schedule:
    # 北京时间 2026-10-01 12:00 起，每 15 分钟补试，至当天结束。
    # 日期门限防止以后每年重复发布；成功后自动停用本工作流。
    - cron: '0,15,30,45 4-15 1 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅验证发布条件，不创建 Release 或标签'
        type: boolean
        default: true

concurrency:
  group: release-v1.10.3
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v1.10.3
  RELEASE_SHA: ca195edc6d9488ad58d2396f34423dee25e9a757
  PUBLISH_AT: '2026-10-01T04:00:00Z'
  EXPIRES_AT: '2026-10-01T16:00:00Z'
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  release:
    if: github.repository == 'noroadback/madmodel-proxy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check publish time
        id: window
        uses: actions/github-script@v8
        with:
          script: |
            const now = Date.now();
            const dryRun = process.env.DRY_RUN === 'true';
            const ready = dryRun || (now >= Date.parse(process.env.PUBLISH_AT) &&
              now < Date.parse(process.env.EXPIRES_AT));
            core.setOutput('ready', ready);
            core.info(ready ? (dryRun ? 'Dry run only.' : 'Publish window is open.') :
              'Outside the publish window; no release will be created.');

      - uses: actions/checkout@v5
        if: steps.window.outputs.ready == 'true'
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        if: steps.window.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Check release files
        if: steps.window.outputs.ready == 'true'
        run: npm run check:release

      - name: Verify and publish
        if: steps.window.outputs.ready == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const repo = context.repo;
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const dryRun = process.env.DRY_RUN === 'true';
            const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (head !== sha) throw new Error('Checkout does not match the release commit.');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (`v${pkg.version}` !== tag) throw new Error('Package version does not match the release tag.');
            const [heading, ...lines] = fs.readFileSync(`.github/releases/${tag}.md`, 'utf8').split(/\r?\n/);
            const name = heading.replace(/^# /, '');
            const body = lines.join('\n').trim();
            if (!name.startsWith(`${tag} `) || !body) throw new Error('Release notes are missing or invalid.');

            const { data: checks } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'test.yml', head_sha: sha, event: 'push', per_page: 20,
            });
            const check = checks.workflow_runs[0];
            if (!check || check.head_sha !== sha || check.status !== 'completed' || check.conclusion !== 'success') {
              throw new Error('All CI checks must pass for the fixed release commit.');
            }
            const optional = async request => {
              try { return (await request()).data; }
              catch (error) { if (error.status === 404) return null; throw error; }
            };
            let release = await optional(() => github.rest.repos.getReleaseByTag({ ...repo, tag }));
            const tagRef = await optional(() => github.rest.git.getRef({ ...repo, ref: `tags/${tag}` }));
            if (tagRef) {
              const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: tag });
              if (commit.sha !== sha) throw new Error('Existing tag points to another commit; refusing to overwrite.');
            }
            if (release && (release.draft || release.prerelease || release.name !== name || release.body?.trim() !== body)) {
              throw new Error('Existing release differs from the prepared version; refusing to overwrite.');
            }
            const { data: latest } = await github.rest.repos.getLatestRelease(repo);
            if (!['v1.10.2', tag].includes(latest.tag_name)) {
              throw new Error('Latest release has changed; check this schedule before publishing.');
            }
            if (dryRun) {
              core.info(`Dry run passed: ${tag} at ${sha}. No release or tag was created.`);
              await core.summary.addHeading('Release dry run passed')
                .addRaw(`${tag}\n\nCommit: ${sha}\n\nScheduled for 2026-10-01 12:00 Asia/Shanghai.\n\n${body}`)
                .write();
              return;
            }
            const now = Date.now();
            if (now < Date.parse(process.env.PUBLISH_AT) || now >= Date.parse(process.env.EXPIRES_AT)) {
              throw new Error('Publish window closed; no release was created.');
            }
            if (!release) {
              ({ data: release } = await github.rest.repos.createRelease({ ...repo,
                tag_name: tag, target_commitish: sha, name, body,
                draft: false, prerelease: false, make_latest: 'true',
              }));
            }
            const { data: published } = await github.rest.repos.getCommit({ ...repo, ref: tag });
            if (published.sha !== sha) throw new Error('Published tag does not match the release commit.');
            await core.summary.addHeading('Released')
              .addLink(name, release.html_url).addRaw(`\n\nCommit: ${sha}`).write();
            await github.rest.actions.disableWorkflow({ ...repo, workflow_id: 'release.yml' });
            core.info('Release verified. This one-time schedule is now disabled.');
